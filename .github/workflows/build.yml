
name: Build RERACE Provider

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rerace-provider-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and publish provider bundles
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Build provider bundles
        run: npm run build

      - name: Publish generated bundles to main
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f dist/
          if ! git diff --cached --quiet; then
            git commit -m "Publish RERACE provider bundles"
            git push
          else
            echo "Provider bundles are already up to date."
          fi

      - name: Upload generated provider bundles
        uses: actions/upload-artifact@v4
        with:
          name: vega-provider-bundles
          path: dist/
          if-no-files-found: error
          retention-days: 14
