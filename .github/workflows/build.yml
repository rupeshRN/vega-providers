
name: Build RERACE Provider

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rerace-provider-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Install dependencies and build providers
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Build provider bundles
        run: npm run build

      - name: Upload generated provider bundles
        uses: actions/upload-artifact@v4
        with:
          name: vega-provider-bundles
          path: dist/
          if-no-files-found: error
          retention-days: 14
